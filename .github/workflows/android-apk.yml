name: Build SHER AI Android APK
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, feature/chat-first-ui, feature/enable-image-generator, feature/mobile-first-app-builder]
    paths:
      - "src/**"
      - "api/**"
      - "lib/server/**"
      - "public/**"
      - "vercel.json"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://sher-ai-swart.vercel.app' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://hltlskzpwqrhiedmomfx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_EKo3T3p1J7vVYqMQdTN2oQ__Ig0O8N6' }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sher-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK as latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./public/app-version.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk SHER-AI.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" SHER-AI.apk --clobber
          else
            gh release create "v$VERSION" SHER-AI.apk --title "SHER AI v$VERSION" --notes "SHER AI Android APK release v$VERSION"
          fi
